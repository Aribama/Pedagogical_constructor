name: pedagogical-constructor

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lessonapp_db
      POSTGRES_USER: lessonapp_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Create .env from .env.example}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lessonapp_user -d lessonapp_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Create .env from .env.example}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_NAME: lessonapp_db
      DATABASE_USER: lessonapp_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Create .env from .env.example}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  database:
  static:
  media:
